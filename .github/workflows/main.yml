name: build

on:
  push:
    branches: [main]
    paths: ["*.rb"]
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to bump and bottle
        required: true
      version:
        description: New version
        required: true

concurrency:
  group: bottle-publish-main
  cancel-in-progress: false

env:
  HOMEBREW_DEVELOPER: 1
  BOTTLE_ROOT_URL: "https://ghcr.io/v2/evanpurkhiser/personal"

jobs:
  prepare:
    name: resolve changed formulas
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.packages.outputs.has_packages }}
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: packages
        name: Select formulas to publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORMULA: ${{ github.event.inputs.formula }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PACKAGES=$(python3 .github/scripts/select-formulas.py --formula "$INPUT_FORMULA")
          else
            PACKAGES=$(python3 .github/scripts/select-formulas.py --before "$PUSH_BEFORE" --after "$PUSH_SHA")
          fi

          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "has_packages=$(jq -r 'length > 0' <<< "$PACKAGES")" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: prepare
    if: needs.prepare.outputs.has_packages == 'true'
    runs-on: macos-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up tap
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/evanpurkhiser"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/evanpurkhiser/homebrew-personal"

      - name: Bump formula
        if: github.event_name == 'workflow_dispatch'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          brew bump-formula-pr \
            --write-only \
            --no-audit \
            --version="${INPUT_VERSION}" \
            "evanpurkhiser/personal/${MATRIX_PACKAGE}"

      - name: Ensure bottle tag is available
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          brew install skopeo

          VERSION=$(brew info --json=v1 --formula "evanpurkhiser/personal/${MATRIX_PACKAGE}" | jq -r '.[0].versions.stable')
          IMAGE="ghcr.io/evanpurkhiser/personal/${MATRIX_PACKAGE}:${VERSION}"

          if INSPECT_ERROR=$(skopeo inspect --creds "${GHCR_USER}:${GHCR_TOKEN}" "docker://${IMAGE}" 2>&1); then
            echo "Bottle ${IMAGE} already exists; refusing to replace its formula metadata."
            exit 1
          fi

          if ! grep -qi "manifest unknown" <<< "$INSPECT_ERROR"; then
            echo "Unable to verify that bottle ${IMAGE} is unpublished:"
            echo "$INSPECT_ERROR"
            exit 1
          fi

      - name: Build and bottle package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          rm -rf /usr/local/include/c++

          FORMULA="evanpurkhiser/personal/${MATRIX_PACKAGE}"
          brew install --force --build-bottle "$FORMULA"
          brew bottle --force-core-tap --json --root-url="$BOTTLE_ROOT_URL" "$FORMULA"

      - name: Ensure main has not changed
        run: |
          git fetch origin main

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed during the build; refusing to upload a bottle from a stale checkout."
            exit 1
          fi

      - name: Upload bottle and update formula
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: brew pr-upload --root-url="$BOTTLE_ROOT_URL" --no-commit

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          VERSION=$(brew info --json=v1 --formula "evanpurkhiser/personal/${MATRIX_PACKAGE}" | jq -r '.[0].versions.stable')
          VERSION="${VERSION#v}"

          git add "${MATRIX_PACKAGE}.rb"
          git diff --cached --quiet && {
            echo "Bottle upload did not produce a formula update."
            exit 1
          }

          git commit -m "${MATRIX_PACKAGE}: v${VERSION} (bottled)"
          git pull --rebase origin main
          git push origin HEAD:main
